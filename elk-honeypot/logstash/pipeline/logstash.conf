input {
  beats {
    port => 5044
    ssl => true
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca.crt"]
    ssl_certificate => "/usr/share/logstash/certs/logstash.crt"
    ssl_key => "/usr/share/logstash/certs/logstash.key"
    ssl_verify_mode => "peer"
  }
}

filter {
  # 1. Extract the JSON variables from the raw log agent message string
  json {
    source => "message"
  }

  # 2. Convert incoming attacker IP string into geographic location maps
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "source"
    }
  }

  # 3. Strict Event-Based Threat Classification Ruleset
  # Matches your Random Forest criteria: It is ONLY a human if a command is explicitly being typed.
  if [eventid] == "cowrie.command.input" {
    mutate {
      add_field => { "threat_type" => "human" }
    }
  } 
  # Automated login attempts, connection drops, network scans, and sweeps map directly to BOT
  else {
    mutate {
      add_field => { "threat_type" => "bot" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "honeypot-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
